apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: os-credentials
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: k8s-secret-store      # name of the SecretStore (or kind specified)
  target:
    name: os-credentials       # name of the k8s Secret to be created
  data:
  - secretKey: OS_PASSWORD
    remoteRef:
      key: initial-secret
      property: ES_PASSWORD
