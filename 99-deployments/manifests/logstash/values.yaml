
####### SYSLOG ############
logstash-syslog:
  enabled: true
  #maxUnavailable: 1

  replicas: 1
  fullnameOverride: logstash-syslog #From Syslog to Kafka
  image: asia-southeast1-docker.pkg.dev/its-artifact-commons/utils/logstash #"grafana/logstash-output-loki" 
  imageTag: v8.15.1-3

  service:
    type: NodePort
    ports:
    - name: syslog-udp
      port: 5140 #443
      targetPort: 5140
      protocol: UDP
      nodePort: 30140

  extraEnvs:
    - name: DUMMY_FOR_RESTART #If need to restart pod manually then change this
      value: "030"

    - name: LS_JAVA_OPTS
      value: "-Xmx256m -Xms256m"

    - name: POD_UID
      valueFrom:
        fieldRef:
          fieldPath: metadata.uid

    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name

  logstashConfig:
    logstash.yml: |
      http.host: "0.0.0.0"
      pipeline.ecs_compatibility: "disabled"

  extraVolumeMounts:
    - name: scripts
      mountPath: /scripts/
      readOnly: true

    - name: configs
      mountPath: /configs/
      readOnly: true

  extraVolumes:
    - name: scripts
      configMap:
        name: ruby-filter-cm

    - name: configs
      configMap:
        name: ruby-config-cm

  logstashPipeline:
    logstash.conf: |
      # echo "message" | nc -q0 syslog.devops.napbiotec.io 5140
      # logger -P 5140 -d -n syslog.devops.napbiotec.io "hello-abc,world this is seub"

      input {
        syslog {
          port => 5140
        }
      }

      filter {
        ruby {
          path => "/scripts/filter.rb"
          script_params => {}
        }
      }

      output {
        #stdout { codec => rubydebug  }

        if [type] == "syslog" {
          kafka {
            bootstrap_servers => "kafka.kafka.svc.cluster.local:9092"
            topic_id => "syslog-received"
            codec => json
          }

          #loki {
          #  message_field => "message"
          #  include_fields => [
          #    "type", 
          #    "category",
          #    "evt_category", 
          #    "debug_field1", 
          #    "dst_net", 
          #    "dst_port", 
          #    "dst_ip_alert", 
          #    "mac", 
          #    "possible_user", 
          #    "src_ip", 
          #    "src_net"
          #  ]
          #  url => "http://loki-soc-gateway.loki-soc.svc.cluster.local/loki/api/v1/push"
          #}
        }
      }
