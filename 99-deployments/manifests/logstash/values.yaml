kafka-to-os:
  enabled: true
  replicas: 2
  fullnameOverride: logstash-kafka-to-os #From Kafka to OpenSearch
  image: asia-southeast1-docker.pkg.dev/its-artifact-commons/utils/logstash #"grafana/logstash-output-loki" 
  imageTag: v8.15.1-3

  extraEnvs:
    - name: OS_USER
      value: "admin"

    - name: OS_PASSWORD
      valueFrom:
        secretKeyRef:
          name: os-credentials
          key: OS_PASSWORD

    - name: DUMMY
      value: "000"

    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name

  logstashConfig:
    logstash.yml: |
      http.host: "0.0.0.0"
      pipeline.ecs_compatibility: "disabled"

  extraVolumeMounts:
    - name: scripts
      mountPath: /scripts/
      readOnly: true

  extraVolumes:
    - name: scripts
      configMap:
        name: ruby-filter-cm

  logstashPipeline:
    logstash.conf: |
      input {
        kafka {
          bootstrap_servers => "kafka.kafka.svc.cluster.local:9092"
          group_id => "for-kafka-to-os"
          consumer_threads => 1
          topics => [ "syslog-received" ]
          codec => "json"
          type => "log"
          auto_offset_reset => "earliest"
        }
      }

      filter {
        ruby {
          code => "event.set('target', 'elasticsearch')"
        }

        ruby {
          path => "/scripts/kafka-to-os.rb"
          script_params => {}
        }

        prune {
          interpolate => true
          remove_field => [ "agent", "host" ]
        }
      }

      output {
        #stdout { codec => rubydebug }        

        opensearch {
          hosts => [ "https://opensearch-cluster-master.opensearch.svc.cluster.local:9200" ]
          ssl_certificate_verification => false
          user => "${OS_USER}"
          password => "${OS_PASSWORD}"
          action => "create"

          ecs_compatibility => "v8"
          http_compression => "true"

          index => "mikrotik-%{[evt_ts_yyyy]}%{[evt_ts_mm]}%{[evt_ts_dd]}-%{[cust_pod_name_kafka_to_os]}"
          timeout => "0.5"
        }
      }


####### SYSLOG ############
logstash-syslog:
  enabled: true
  #maxUnavailable: 1
  # Allow multiple replicas on the same node
  antiAffinity: soft
  
  replicas: 2
  fullnameOverride: logstash-syslog #From Syslog to Kafka
  image: asia-southeast1-docker.pkg.dev/its-artifact-commons/utils/logstash #"grafana/logstash-output-loki" 
  imageTag: v8.15.1-3

  service:
    type: NodePort
    ports:
    - name: syslog-udp
      port: 5140 #443
      targetPort: 5140
      protocol: UDP
      nodePort: 30140

  extraEnvs:
    - name: DUMMY_FOR_RESTART #If need to restart pod manually then change this
      value: "030"

    - name: LS_JAVA_OPTS
      value: "-Xmx256m -Xms256m"

    - name: POD_UID
      valueFrom:
        fieldRef:
          fieldPath: metadata.uid

    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name

  logstashConfig:
    logstash.yml: |
      http.host: "0.0.0.0"
      pipeline.ecs_compatibility: "disabled"

  extraVolumeMounts:
    - name: scripts
      mountPath: /scripts/
      readOnly: true

    - name: configs
      mountPath: /configs/
      readOnly: true

  extraVolumes:
    - name: scripts
      configMap:
        name: ruby-filter-cm

    - name: configs
      configMap:
        name: ruby-config-cm

  logstashPipeline:
    logstash.conf: |
      # echo "message" | nc -q0 localhost 30140
      # logger -P 30140 -d -n localhost "hello-abc,world this is seub"

      input {
        syslog {
          port => 5140
        }
      }

      filter {
        ruby {
          path => "/scripts/filter.rb"
          script_params => {}
        }
      }

      output {
        #stdout { codec => rubydebug  }

        if [type] == "syslog" {
          kafka {
            bootstrap_servers => "kafka.kafka.svc.cluster.local:9092"
            topic_id => "syslog-received"
            codec => json
          }

          loki {
            message_field => "message"
            include_fields => [
              "type", 
              "category",
              "evt_category", 
              "debug_field1", 
              "dst_net", 
              "dst_port", 
              "dst_ip_alert", 
              "mac", 
              "possible_user", 
              "src_ip", 
              "src_net"
            ]
            url => "http://loki-soc.loki-soc.svc.cluster.local:3100/loki/api/v1/push"
          }
        }
      }
