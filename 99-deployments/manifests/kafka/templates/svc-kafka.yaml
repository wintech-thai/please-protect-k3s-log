apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: kafka
      port: {{ .Values.service.port }}
      targetPort: kafka

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  labels:
    app.kubernetes.io/name: kafka
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: kafka
      port: {{ .Values.service.port }}
      targetPort: kafka
    - name: controller
      port: {{ .Values.service.controllerPort }}
      targetPort: controller
