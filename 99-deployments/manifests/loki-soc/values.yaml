
loki-stack:
  enabled: true

  test_pod:
    enabled: false

  promtail:
    enabled: false

  loki:
    fullnameOverride: loki-soc

    persistence:
      enabled: true
      size: 30Gi #TODO : ปรับให้รองรับ 90 วัน

    config:
      schema_config:
        configs:
          - from: "2026-10-31"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h

      limits_config:
        retention_period: 2160h

      compactor:
        working_directory: /data/retention
        compaction_interval: 10m
        retention_enabled: true
        retention_delete_delay: 2h
        delete_request_store: filesystem

    alerting_groups: []

  grafana:
    enabled: true
    fullnameOverride: loki-soc-grafana

    envRenderSecret: {}

    admin:
      existingSecret: grafana-credentials
      userKey: GRAFANA_USER
      passwordKey: GRAFANA_PASSWORD

    image:
      tag: 9.5.21

    grafana.ini:
      server:
        root_url: "%(protocol)s://%(domain)s/tools/grafana-soc"
        serve_from_sub_path: true
        domain: ""

    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Loki
            type: loki
            access: Server
            url: http://loki-soc.loki-soc.svc.cluster.local:3100
