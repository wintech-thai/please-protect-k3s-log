
loki-stack:
  enabled: true

  test_pod:
    enabled: false

  promtail:
    enabled: false

  loki:
    fullnameOverride: loki-soc

    persistence:
      enabled: true
      size: 30Gi

    config: {}
    alerting_groups: []

  grafana:
    enabled: true
    fullnameOverride: loki-soc-grafana

    envRenderSecret: {}

    admin:
      existingSecret: grafana-credentials
      userKey: GRAFANA_USER
      passwordKey: GRAFANA_PASSWORD

    image:
      tag: 9.5.21

    grafana.ini:
      server:
        root_url: "%(protocol)s://%(domain)s/tools/grafana-soc"
        serve_from_sub_path: true
        domain: ""

    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Loki
            type: loki
            access: Server
            url: http://loki-soc.loki-soc.svc.cluster.local:3100
