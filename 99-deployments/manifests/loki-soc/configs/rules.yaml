
global:
  window: 5m
  limit: 100
  alert_ttl: 2m

rules:
  - name: LokiWatchdog
    enabled: true
    window: 1m
    query: |
      sum(count_over_time({type="syslog"}[1m])) >= 1
    severity: none
    annotations:
      summary: "This is an alert meant to ensure that the entire Loki alerting is functional."

  - name: UnknownCategoryError
    enabled: true
    window: 15m
    query: |
      sum(count_over_time({type="syslog", category="unknown"}[15m])) >= 1
    severity: warning
    annotations:
      description: "Found unknown identifiable log line(s)"

  - name: SystemCategoryFound
    enabled: true
    window: 15m
    query: |
      sum(count_over_time({type="syslog", category="system"}[15m])) >= 1
    severity: warning
    annotations:
      description: "Found line(s) of [system] category"

  - name: NoDataToSyslogError
    enabled: true
    window: 5m
    query: |
      (sum(count_over_time({type="syslog"}[5m])) or vector(0)) <= 50
    severity: warning
    annotations:
      description: "Found syslog log line(s) less than or equal to threshold [50] within 5 minutes"

  - name: FailedAttemptLogin
    enabled: true
    window: 5m
    query: |
      sum(count_over_time({type="syslog", category="hotspot"} |= "login failed"[5m])) >= 1
    severity: warning
    annotations:
      description: "Detected failed login attempt(s)"
