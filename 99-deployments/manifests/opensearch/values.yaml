opensearch-dashboards:
  replicas: 1

  image:
    repository: opensearchproject/opensearch-dashboards
    pullPolicy: IfNotPresent

  opensearchHosts: "https://opensearch-cluster-master:9200"

  service:
    type: ClusterIP
    port: 5601

  ingress:
    enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 768Mi

  config:
    opensearch_dashboards.yml: |
      server.host: "0.0.0.0"
      opensearch.ssl.verificationMode: none
      server.host: "0.0.0.0"
      server.basePath: "/tools/os-dashboard"
      server.rewriteBasePath: true
      opensearch.ssl.verificationMode: none

opensearch:
  clusterName: opensearch-cluster
  nodeGroup: master

  singleNode: true
  replicas: 1

  image:
    repository: opensearchproject/opensearch
    pullPolicy: IfNotPresent

  opensearchJavaOpts: "-Xms1g -Xmx1g"

  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      memory: 3Gi

  persistence:
    enabled: true
    size: 30Gi
    accessModes:
      - ReadWriteOnce
    enableInitChown: true
    # ใช้ default StorageClass ของ cluster
    # storageClass: local-path

  service:
    type: ClusterIP

  ingress:
    enabled: false

  sysctlInit:
    enabled: true

  securityConfig:
    enabled: true

  extraEnvs:
    - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: os-credentials
          key: OS_PASSWORD
