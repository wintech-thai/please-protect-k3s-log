apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: memcached
spec:
  generators:
  - clusters:
      selector:
        matchLabels:
          custom: "true"
  template:
    metadata:
      name: 'memcached-{{name}}'
    spec:
      project: "default"
      source:
        repoURL: https://github.com/wintech-thai/please-protect-k3s-log.git
        targetRevision: "{{name}}" #Based on environment
        path: '99-deployments/manifests/memcached'
        helm:
          ignoreMissingValueFiles: true
          valueFiles:
            - values.yaml
            - values-{{name}}.yaml
      destination:
        name: in-cluster
        namespace: memcached
      syncPolicy:
        automated:
          selfHeal: false
          prune: true
        syncOptions:
          - CreateNamespace=true
